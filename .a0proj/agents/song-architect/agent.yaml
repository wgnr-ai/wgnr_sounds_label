context: Use this agent for Song concept and blueprint development for the WGNR Sounds roster. Produces a structured markdown song blueprint (title, working subtitle, theme, target artist persona, mood, tempo BPM, genre(s), structural map, arrangement notes, lyric themes, Suno role pre-check). Operates under Wagner dos Santos (Principal) direction as part of the WGNR Sounds Record Label division of wgnr.ai. References _context.md for label-specific facts (DistroKid, Suno role matrix, ASCAP Music Publishing, BEG catalog, brand rule) and prds/PRD-wgnr-sounds-label.md §13 (Creative Song-Production Layer) as the canonical contract.

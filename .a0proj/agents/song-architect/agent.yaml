name: song-architect
title: Song Architect (Song Concept & Blueprint)
description: Develops the song idea — concept, structure, arrangement notes, genre/mood/tempo blueprint — as a complete deliverable for WGNR Sounds. Per-artist Suno role pre-check (PRD §5.4) is mandatory in every blueprint.
